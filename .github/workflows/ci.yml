name: CI

# Compile-only check for every push and pull request to warthurton (no release, no signing).
# Also runs the navigation lifecycle regression checks added by upstream PR #142
# (previously in navigation-regression.yml, folded in here).

on:
  push:
    branches: [ warthurton ]
  pull_request:
    branches: [ warthurton ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Run navigation lifecycle regression checks
        run: dotnet run --project tests/NavigationCompletion.Tests.csproj --configuration Release

  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [ 'net9.0-windows', 'net481' ]
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - name: Build ${{ matrix.framework }}
        run: |
          msbuild ExplorerTabUtility/ExplorerTabUtility.csproj /restore /p:Configuration=Release /p:TargetFramework=${{ matrix.framework }} /m /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh
